<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNW workouts editor</title>
<meta name="robots" content="noindex">
</head>
<body style="margin:0;background:#fff">
<style>
/* CNW workouts editor. Ported from mockups/editor-page/Editor2.dc.html. */
body{margin:0;background:#f3f6fb;font-family:Arial,Helvetica,sans-serif;color:#111}
button{font-family:inherit;color:#111}
.app{min-width:1100px;max-width:1320px;min-height:100vh;background:#f3f6fb}
.topbar{background:#203c7f;color:#fff;display:flex;align-items:center;gap:22px;padding:8px 24px}
.topbar img{height:44px;width:44px;background:#fff;padding:2px}
.topbar .who{margin-left:auto;font-size:13px;display:flex;gap:10px;align-items:center}
.topbar .who a{color:#fff}
.tabbtn{font-size:15px;font-weight:bold;padding:0 18px;min-height:44px;border:0;background:transparent;color:#fff;cursor:pointer;border-bottom:4px solid transparent}
.tabbtn.on{border-bottom-color:#ff7338}
.btn{font-size:14px;font-weight:bold;padding:0 14px;min-height:40px;border:2px solid #203c7f;background:#fff;color:#203c7f;cursor:pointer}
.btn.pri{background:#203c7f;color:#fff}
.btn.sm{min-height:32px;font-size:13px;padding:0 10px}
.btn:disabled{opacity:.5;cursor:default}
.cp{text-align:center;padding:4px 2px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box}
.cp.cl{flex:0 0 68px}
.many .cp.cl{flex:1 1 0;min-width:0}
.cp.cs{flex:1 1 0;min-width:0;min-height:66px}
.cp.ph{background:#f6f8fb;color:#5b6784;border:1px dotted #8a97b5}
.cp.dr{background:#fff;color:#203c7f;border:2px solid #203c7f}
.cp.pb{background:#bfe3cb;color:#14442a;border:2px solid #5fae7b}
.cp.race{border-bottom:6px solid #ff7338}
.cp.on{outline:3px solid #111;outline-offset:1px}
.cp.plus{background:#fff;color:#203c7f;border:1px dashed #203c7f;font-size:24px;font-weight:bold}
.cp.plus.on{background:#203c7f;color:#fff;outline:none}
.cp.cx .a{text-decoration:line-through}
.wkrow{padding:6px 8px 8px;margin-bottom:6px}
.wkrow.past{background:repeating-linear-gradient(45deg,#eceff4,#eceff4 6px,#e1e5ec 6px,#e1e5ec 12px)}
.wkrow.past .cp{opacity:.7}
.wkrow.now{background:#e4edfb}
.cp .a{font-size:13px;font-weight:bold}
.cp .b{font-size:10px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp .c{font-size:9px;font-weight:bold;letter-spacing:.03em;text-transform:uppercase;line-height:1.2}
.chipst{display:inline-block;font-size:11px;font-weight:bold;padding:2px 7px;border:1px dotted #8a97b5;color:#5b6784;background:#f6f8fb}
.chipst.dr{border:2px solid #203c7f;color:#203c7f;background:#fff}
.chipst.pb{background:#bfe3cb;color:#14442a;border:2px solid #5fae7b}
.chipst.none{display:none}
.lbl{display:block;font-size:12px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;color:#203c7f;margin:10px 0 4px}
.inp{font-family:inherit;font-size:15px;border:1px solid #6b7a99;padding:8px 10px;width:100%;box-sizing:border-box;background:#fff;color:#111}
.inp.bad{border-color:#b3261e;background:#fdecea}
textarea.inp{resize:vertical;line-height:1.45}
.mono{font-family:Consolas,Menlo,monospace;font-size:15px}
.card{background:#fff;border:1px solid #9aa9c7;padding:16px 18px;margin-bottom:14px}
.res{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;padding:4px 0;border-bottom:1px solid #e1e6f0}
.res .n{flex:0 0 22px;color:#666;text-align:right}
.res .st{flex:0 0 74px;font-weight:bold}
.res.ok .st{color:#1d6b2f}
.res.txt .st{color:#555}
.res.err .st{color:#b3261e}
.row{display:flex;border-left:1px solid #000}
.cell{flex:1 1 0;min-width:0;border-right:1px solid #000;border-bottom:1px solid #000;padding:5px 3px;text-align:center;background:#fff;font-family:Cambria,Georgia,serif}
.cell.first{flex:0 0 138px;font-weight:bold;text-align:left;padding-left:10px;font-size:15px}
.gsub{font-size:12px;font-weight:normal;color:#444;line-height:1.3}
.head .cell{background:#bcd8f7;border-top:1px solid #000;font-weight:bold;font-size:13px}
.big{font-size:20px;font-weight:bold}
.small{font-size:12px;color:#444;min-height:15px}
.gt{width:100%;border-collapse:collapse;background:#fff}
.gt th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#203c7f;text-align:left;padding:8px;border-bottom:2px solid #203c7f}
.gt td{padding:6px 8px;border-bottom:1px solid #d5dcea;font-size:15px}
.ghost{font-family:inherit;background:transparent;border:1px dashed transparent;width:100%;padding:4px 6px;box-sizing:border-box;resize:none;color:inherit;line-height:inherit;font-size:inherit}
.ghost:hover{border-color:#203c7f;background:rgba(255,255,255,.5)}
.ghost:focus{background:#fff;border:1px solid #203c7f;outline:none}
.ghost::placeholder{color:#6b7893;font-style:italic}
.tabinp{font-family:Cambria,Georgia,serif;font-weight:bold;font-size:16px;border:0;padding:0 8px;background:transparent;min-height:42px;box-sizing:border-box;color:#111}
.banner2{background:#fff;border:2px solid #000;margin-bottom:14px}
.bn2{background:#ff7338;border-bottom:2px solid #000;padding:6px 10px}
.bn2 .bigname{font-size:30px;font-weight:bold;color:#111;line-height:1.2}
.bb2{padding:8px 14px;font-size:16px;line-height:1.5}
.dock{margin-top:16px;border:2px dashed #203c7f;background:#f4f8ff;padding:12px 14px;font-family:Arial,Helvetica,sans-serif}
.wk{font-size:12px;font-weight:bold;color:#203c7f;margin:12px 0 4px}
.h2in{font-family:Cambria,Georgia,serif;font-size:28px;font-weight:bold;color:#111;padding:0 4px;width:auto}
.tabrow{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end;padding-left:8px}
.tabon,.tabof{display:flex;align-items:center;border:2px solid #000;border-bottom:0;border-radius:10px 10px 0 0;padding:0 4px 0 4px;box-sizing:border-box}
.tabon{background:#fff;min-height:48px;margin-bottom:-2px;position:relative;z-index:1;box-shadow:inset 0 5px 0 #203c7f}
.tabon .tabinp{padding-top:5px}
.tabof{background:rgba(255,255,255,.55);border-color:#4a6aa5;min-height:42px}
.tabof:hover{background:rgba(255,255,255,.9)}
.tab2{background:transparent;border:0;font-family:Cambria,Georgia,serif;font-weight:bold;font-size:16px;padding:0 10px;min-height:40px;cursor:pointer;color:#203c7f}
.tabx{border:0;background:transparent;color:#6b7893;font-size:20px;line-height:1;cursor:pointer;width:26px;height:26px;border-radius:13px;padding:0}
.tabx:hover{background:#fde8e6;color:#b3261e}
.warnin{color:#b3261e;font-weight:bold;font-family:Arial,Helvetica,sans-serif;font-size:14px}
.warn{background:#fdecea;border:2px solid #b3261e;color:#b3261e;font-weight:bold;font-family:Arial,Helvetica,sans-serif;font-size:14px;padding:8px 12px;margin-bottom:10px}
.linkbtn{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#203c7f;background:rgba(255,255,255,.6);border:1px dashed #6b7a99;padding:4px 10px;cursor:pointer;min-height:32px}
.toast{background:#e2f1e4;border:1px solid #1d6b2f;padding:8px 14px;margin-bottom:14px;font-size:14px}
.toast.bad{background:#fdecea;border-color:#b3261e;color:#7a1712}
.saving{font-size:13px;color:#555;margin-left:12px}
.saving.bad{color:#b3261e;font-weight:bold}
.hist{margin-top:10px;border-top:1px solid #d5dcea;padding-top:8px;font-size:13px}
.hist table{width:100%;border-collapse:collapse}
.hist td{padding:4px 6px;border-bottom:1px solid #e1e6f0}
.calerr{font-size:12px;color:#b3261e;font-weight:bold;margin-bottom:6px}
.imp td,.imp th{font-size:13px;vertical-align:top}
.imp .mono{font-size:12px;white-space:pre-wrap}
.loading{min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.loading img{width:120px;height:auto}
.loading .ldt{font-size:14px;color:#555;font-family:Arial,Helvetica,sans-serif}
.loading p{margin:0;max-width:520px;font-family:Cambria,Georgia,serif;font-style:italic;font-size:22px;line-height:1.4;color:#203c7f}
.center{max-width:560px;margin:80px auto;background:#fff;border:1px solid #9aa9c7;padding:28px 32px;font-size:16px;line-height:1.5}
.muted{color:#555}

/* Auto-width inputs: the hidden copy of the text sets the width. */
.autow{display:inline-grid;vertical-align:baseline;max-width:100%;min-width:0}
.autow>*{grid-area:1/1/2/2;min-width:0}
.autow>input{width:100%}
.autow>.mirror{visibility:hidden;white-space:pre;overflow:hidden;display:block;height:0;border-top-width:0;border-bottom-width:0;padding-top:0;padding-bottom:0}
.btn.danger{border-color:#b3261e;color:#b3261e}
.btn.quiet{border-color:#8a97b5;color:#203c7f}
.confirm{margin-top:10px;border:2px solid #b3261e;background:#fdecea;padding:10px 12px;font-size:14px;line-height:1.5}
.modx{border:0;background:transparent;color:#6b7893;font-size:18px;cursor:pointer;width:26px;height:26px;border-radius:13px;padding:0;flex:0 0 26px}
.modx:hover{background:#fde8e6;color:#b3261e}

/* Pace groups: fixed name/VDOT/equivalents, scrolling pace columns. */
.gscroll{overflow-x:auto;max-width:100%;border:1px solid #d5dcea;background:#fff}
.gtab{width:max-content;min-width:100%}
.gtab .fix,.gtab .fixr{position:sticky;background:#fff;z-index:1}
.gtab th.fix,.gtab th.fixr{z-index:2}
.gtab .f1{left:0;width:160px;min-width:160px}
.gtab .f2{left:176px;width:80px;min-width:80px}
.gtab .f3{left:272px;width:64px;min-width:64px}
.gtab .f4{left:352px;width:64px;min-width:64px}
.gtab .f5{left:432px;width:76px;min-width:76px}
.gtab .eq{font-weight:bold}
.gtab .last{box-shadow:inset -2px 0 0 #203c7f}
.gtab .fixr{right:0;width:44px;box-shadow:inset 2px 0 0 #d5dcea}
.gtab .pc{min-width:64px;white-space:nowrap}

/* Computed (read-only) columns are gray; the name and VDOT inputs stay white. */
.gtab td.eq,.gtab td.pc{background:#eef0f4;color:#333}
.gtab th.eq,.gtab th.pc{background:#e4e7ed}
.gtab td.f1 .inp,.gtab td.f2 .inp{background:#fff;border-color:#203c7f}
.btn.icon{display:inline-flex;align-items:center;justify-content:center;width:36px;padding:0}

/* Hover tints so every button looks clickable (mouse devices only). */
@media (hover:hover){
  .btn:not(:disabled):hover{background:#eef2fa}
  .btn.pri:not(:disabled):hover{background:#2c4f9a}
  .btn.danger:not(:disabled):hover{background:#fde8e6}
  .tabbtn:not(.on):hover{background:rgba(255,255,255,.12)}
  .cp.ph:hover{background:#e6ebf4}
  .cp.dr:hover{background:#eef2fa}
  .cp.pb:hover{background:#acd8bb}
  .cp.plus:not(.on):hover{background:#eef2fa}
}

/* Sign-in card (editor web page) */
.signin{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(243,246,251,.94)}
.signin-card{max-width:440px;width:100%;box-sizing:border-box;background:#fff;border:1px solid #9aa9c7;padding:28px 28px 24px;text-align:center;box-shadow:0 8px 30px rgba(32,60,127,.18)}
.signin-card img{width:84px;height:auto}
.signin-card h2{margin:12px 0 6px;font-size:22px;color:#203c7f}
.signin-card p{margin:0 0 18px;font-size:15px;line-height:1.5;color:#333}
.signin-card .gbtn{min-height:44px;font-size:16px;padding:0 22px}

</style>
<div id="root"><div class="loading"><img id="cnw-load-logo" alt="Club Northwest logo"><p id="cnw-phrase"></p><span class="ldt">Loading the editor…</span></div></div>
<script>
/*
 * One message a day: `coach` on the editor's loading screen, `athlete` on
 * the athlete page. Everyone sees the same one that day, and it moves to
 * the next one each day. Edit freely; keep each one under about 90
 * characters so it fits on a phone in one or two lines.
 */
(function (root) {
  'use strict';

  var coach = [
    'Great teams are built one workout at a time.',
    'Every PR this season is the result of well-executed workouts.',
    'Encourage athletes to volunteer.',
    'CNW athletes train together. Keep them together.',
    'Introduce yourself to an athlete you don\u2019t know at the next workout.',
    'Small workouts, stacked week after week, produce great races.',
    'Coaching is a team sport too.',
    'Train together. Race together. GO ORANGE!'
  ];

  var athlete = [
    'Warm up together, race together. GO ORANGE!',
    'Cheer each other on and encourage each other in workouts and races.',
    'Easy days easy. Hard days together.',
    'Every group, every pace, one team.',
    'Ask yourself: what can I do to contribute to the team?',
    'Stay at the finish line until all your teammates are across the line.',
    'Say hi to someone you don\u2019t know on the warmup today.'
  ];

  // The message of the day: everyone sees the same one on a given date
  // (YYYY-MM-DD), and it moves to the next one each day.
  function daily(list, iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    var day = m ? Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000) : 0;
    return list.length ? list[((day % list.length) + list.length) % list.length] : '';
  }

  // Today's date in Seattle, so loading screens match the club's day
  // everywhere. Falls back to the browser's own date.
  function clubIso() {
    var d = new Date();
    try {
      var s = d.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    } catch (e) { /* old browser */ }
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  var api = { coach: coach, athlete: athlete, daily: daily, clubIso: clubIso };
  root.CNWMessages = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;

<script>
/*
 * CNW core: shorthand parser, VDOT pace math, pace-table builder and small
 * date/format helpers. Pure functions, no DOM, no I/O.
 *
 * Shared by the editor (browser), the feed builder (Apps Script and Node)
 * and the tests. Plain script so it runs in Apps Script's global scope as is.
 */
(function (root) {
  'use strict';

  var MILE = 1609.344;
  var KM_PER_MILE = 1.609344;

  // ---------------------------------------------------------------------------
  // VDOT math (Jack Daniels / Gilbert). v in meters per minute, t in minutes.
  // ---------------------------------------------------------------------------

  function vo2(v) { return -4.60 + 0.182258 * v + 0.000104 * v * v; }
  function pctMax(t) { return 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t); }

  var DIST = { mp: 42195, hmp: 21097.5, '10k': 10000, '8k': 8000, '5k': 5000, '3k': 3000, mile: MILE, '800': 800, '400': 400, '200': 200 };
  var PACE_KEYS = ['200', '400', '800', 'mile', '3k', '5k', '8k', '10k', 'at', 'hmp', 'mp'];
  var PACE_LABEL = { '200': '200m', '400': '400m', '800': '800m', mile: 'Mile', '3k': '3K', '5k': '5K', '8k': '8K', '10k': '10K', at: 'AT', hmp: 'HMP', mp: 'MP' };

  // Race time in seconds for a distance in meters at a given VDOT.
  // Bisection over t from d/600 to d/60 minutes, 60 iterations (as prototyped).
  function raceTimeSec(vdot, meters) {
    var d = meters;
    var lo = d / 600, hi = d / 60;
    for (var i = 0; i < 60; i++) {
      var mid = (lo + hi) / 2;
      if (vo2(d / mid) / pctMax(mid) > vdot) lo = mid; else hi = mid;
    }
    return ((lo + hi) / 2) * 60;
  }

  // Pace in seconds per mile for a pace key ('5k', 'hmp', 'at', ...).
  function paceSecPerMile(vdot, key) {
    if (key === 'at') {
      // 88% of VDOT solved through the VO2 quadratic for velocity.
      var target = 0.88 * vdot;
      var a = 0.000104, b = 0.182258, c = -4.60 - target;
      var v = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
      return MILE / v * 60;
    }
    var d = DIST[key];
    if (!d) throw new Error('Unknown pace key: ' + key);
    return raceTimeSec(vdot, d) / (d / MILE);
  }

  // ---------------------------------------------------------------------------
  // Formatting
  // ---------------------------------------------------------------------------

  function pad2(n) { return String(n).padStart ? String(n).padStart(2, '0') : (n < 10 ? '0' + n : String(n)); }

  // m:ss, or h:mm:ss at an hour or more.
  function fmtClock(s) {
    s = Math.round(s);
    if (s < 0) s = 0;
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h > 0 ? h + ':' + pad2(m) + ':' + pad2(sec) : m + ':' + pad2(sec);
  }

  // Short reps: 100 seconds or less prints as "85sec", otherwise m:ss.
  function fmtShort(s) {
    s = Math.round(s);
    return s <= 100 ? s + 'sec' : fmtClock(s);
  }

  // h:mm for marathon and half equivalents.
  function fmtHM(s) {
    var m = Math.round(s / 60);
    return Math.floor(m / 60) + ':' + pad2(m % 60);
  }

  // ---------------------------------------------------------------------------
  // Group subtext ("~4:07 mile") per the track's ref
  // ---------------------------------------------------------------------------

  var REFS = ['mile', '5k', '10k', 'half', 'marathon'];
  var REF_LABEL = { mile: 'Mile', '5k': '5K', '10k': '10K', half: 'Half marathon', marathon: 'Marathon' };

  // Default ref from the track name when the coach has not picked one.
  function refOf(track) {
    if (track && track.ref && REFS.indexOf(track.ref) > -1) return track.ref;
    var name = (track && track.name) || '';
    if (/marathon/i.test(name)) return 'marathon';
    if (/mid/i.test(name) && !/cross|road|xc/i.test(name)) return 'mile';
    return '5k';
  }

  function refSub(vdot, ref) {
    var key = { mile: 'mile', '5k': '5k', '10k': '10k', half: 'hmp', marathon: 'mp' }[ref] || '5k';
    var s = raceTimeSec(vdot, DIST[key]);
    if (ref === 'mile') return '~' + fmtClock(s) + ' mile';
    if (ref === '10k') return '~' + fmtClock(Math.round(s / 5) * 5) + ' 10K';
    if (ref === 'half') return '~' + fmtHM(s) + ' half';
    if (ref === 'marathon') return '~' + fmtHM(s) + ' marathon';
    return '~' + fmtClock(Math.round(s / 5) * 5) + ' 5K';
  }

  // ---------------------------------------------------------------------------
  // Shorthand parser
  //   [reps x] distance|time @ pace[ ±Ns[/mi|/km]][ effort] [/ pace2 ...][, rest text]
  // ---------------------------------------------------------------------------

  var PACE_RE = /^(hmp|mp|at|10k|8k|5k|3k|mile|800m?|400m?|200m?)\s*(?:([+\-−])\s*(\d+(?:\.\d+)?)\s*(?:s|sec|secs)?\s*(?:\/\s*(mi|mile|km|k))?)?\s*(effort)?$/i;

  function numLabel(n) { return String(Math.round(n * 1000) / 1000); }

  function parseQty(q) {
    var t = q.trim();
    var cm = t.match(/^(\d{1,2}):(\d{2})$/);
    if (cm) {
      var secs0 = parseInt(cm[1], 10) * 60 + parseInt(cm[2], 10);
      return { m: 0, secs: secs0, label: t };
    }
    // Distance range: "6-8mi", "3-4 km". Shown as pace per mile with the time range.
    var rg = t.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)\s*(miles?|mi|km|k|m)$/i);
    if (rg) {

      var unitLabel = f === MILE ? ' miles' : f === 1000 ? ' km' : 'm';

    }

    if (!qm) return null;

    if (!(n > 0)) return null;
    var u = (qm[2] || 'm').toLowerCase();
    if (/^mi(?!n)/.test(u)) return { m: n * MILE, secs: 0, label: numLabel(n) + (n === 1 ? ' mile' : ' miles') };
    if (u === 'km' || u === 'k') return { m: n * 1000, secs: 0, label: numLabel(n) + ' km' };
    if (u === 'm') return { m: n, secs: 0, label: numLabel(n) + 'm' };
    if (/^min/.test(u)) return { m: 0, secs: n * 60, label: numLabel(n) + ' min' };
    return { m: 0, secs: n, label: numLabel(n) + ' sec' };
  }

  // Returns { kind: 'ok'|'txt'|'err', msg, cols?, reps?, rest? }.
  function parseLine(line) {
    var rest = String(line || '').trim();
    var reps = '';
    var rm = rest.match(/^(\d+)(?:\s*[-–‒]\s*(\d+))?\s*[x×]\s*/i);
    if (rm) { reps = rm[2] ? rm[1] + '-' + rm[2] : rm[1]; rest = rest.slice(rm[0].length); }
    var idx = rest.indexOf('@');
    if (idx < 0) return { kind: 'txt', msg: 'Text only. No "@ pace", so it is not added to the table.' };
    var qtyStr = rest.slice(0, idx).trim();

  function firstSession(list, today) {
    var mon = C.mondayOf(today);
    var wk = list.filter(function (it) { return it.date >= today && it.date <= C.addDays(mon, 6); });
    var any = list.filter(function (it) { return C.mondayOf(it.date) === mon; });
    var pick = wk[0] || any[0];
    return pick ? pick.id : '';
  }

  function App() {
    var s = useState(null), ready = s[0], setReady = s[1];
    var f = useState(''), fatal = f[0], setFatal = f[1];
    useEffect(function () {
      // Sign-in check and the first weeks of sessions load side by side, so
      // the editor appears with its data instead of filling in afterwards.
      var guess = window.CNWMessages ? window.CNWMessages.clubIso() : new Date().toISOString().slice(0, 10);
      var chunks = firstChunks(guess);
      var lists = chunks.map(function (cm) {
        return api('listSessions', { from: cm, to: C.addDays(cm, CHUNK_DAYS - 1) }).then(function (list) { return list; }, function () { return null; });
      });
      Promise.all([api('bootstrap')].concat(lists)).then(function (res) {
        var preload = {};
        chunks.forEach(function (cm, i) { if (res[i + 1]) preload[cm] = res[i + 1]; });
        setReady({ boot: res[0], preload: preload });
      }, function (e) { setFatal(e.message); });
    }, []);
    var boot = ready && ready.boot;
    if (fatal) {
      return h('div', { className: 'center' }, [
        h('h2', { key: 'h', style: { marginTop: 0, color: '#203c7f' } }, 'CNW workouts editor'),
        h('p', { key: 'p' }, fatal),
        window.CNW_MODE === 'local' ? h('p', { key: 'l' }, h('a', { href: '/login' }, 'Sign in as someone else'))
          : WEB ? h('p', { key: 'w' }, h('button', { className: 'btn', onClick: Auth.switchAccount }, 'Use a different Google account'))
          : h('p', { key: 'g', className: 'muted' }, 'If you use more than one Google account, open the editor in a private window and sign in with the invited address.')
      ]);
    }
    if (!boot) return h('div', { className: 'loading', role: 'status' }, [h('img', { key: 'i', src: window.CNW_LOGO, alt: 'Club Northwest logo' }), window.CNW_PHRASE ? h('p', { key: 'p' }, window.CNW_PHRASE) : null, h('span', { key: 't', className: 'ldt' }, 'Loading the editor…')]);
    return h(Editor, { boot: boot, preload: ready.preload });
  }

  // ---------------------------------------------------------------- editor

  function Editor(props) {
    var boot = props.boot;
    var today = boot.today;
    var thisMon = C.mondayOf(today);
    var init = {
      tab: 'w', sel: '', ti: 0, toast: '', toastBad: false, top: C.addDays(thisMon, -7),
      items: {}, loaded: {}, drafts: {}, busy: false, conflict: '',
      addWeek: '', add: { series: (boot.series[0] || {}).key || 'one', title: '', time: '', loc: '', wu: '', from: '', until: '', cal: true },
      pubAll: null,
      importOpen: false, imp: { text: '', year: String(+today.slice(0, 4)), preview: null, result: '' },
      histOpen: false, hist: null,
      open: {},
      groups: boot.groups.map(function (g) { return { name: g.name, vdot: String(g.vdot) }; }),
      set: { back: String(boot.settings.weeksBack), fwd: String(boot.settings.weeksFwd) },
      savedSet: boot.settings,
      series: clone(boot.series),
      coaches: boot.coaches, invEmail: '', invRole: 'Coach', coachMsg: '',
      saveState: { g: '', s: '', r: '' }
    };
    var ss = useState(function () {
      // Start with the sessions fetched during the loading screen (first render only).
      Object.keys(props.preload || {}).forEach(function (cm) {
        props.preload[cm].forEach(function (it) { init.items[it.id] = it; });
        init.loaded[cm] = true;
      });
      init.sel = firstSession(Object.keys(init.items).map(function (id) { return init.items[id]; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }), today);
      return init;
    }), st = ss[0], setSt = ss[1];
    var set = function (patch) { setSt(function (prev) { return Object.assign({}, prev, typeof patch === 'function' ? patch(prev) : patch); }); };
    var isAdmin = boot.me.role === 'Admin';

    // Load sessions for the visible weeks (and the selected one), 8 weeks at a time.
    var needed = [];
    for (var wi = -1; wi <= 6; wi++) { var cm = chunkOf(C.addDays(st.top, 7 * wi)); if (needed.indexOf(cm) < 0) needed.push(cm); }
    useEffect(function () {
      needed.forEach(function (cm) {
        if (st.loaded[cm]) return;
        set(function (p) { var l = Object.assign({}, p.loaded); l[cm] = 'loading'; return { loaded: l }; });
        api('listSessions', { from: cm, to: C.addDays(cm, CHUNK_DAYS - 1) }).then(function (list) {
          set(function (p) {
            var items = Object.assign({}, p.items), l = Object.assign({}, p.loaded);
            Object.keys(items).forEach(function (id) { if (items[id].date >= cm && items[id].date <= C.addDays(cm, CHUNK_DAYS - 1)) delete items[id]; });
            list.forEach(function (it) { items[it.id] = it; });
            l[cm] = true;
            var patch = { items: items, loaded: l };
            if (!p.sel) { var pick = firstSession(list, today); if (pick) patch.sel = pick; }
            return patch;
          });
        }, function (e) {
          set(function (p) { var l = Object.assign({}, p.loaded); delete l[cm]; return { loaded: l, toast: 'Could not load the calendar: ' + e.message, toastBad: true }; });
        });
      });
    }, [needed.map(function (cm) { return cm + ':' + (st.loaded[cm] ? 1 : 0); }).join(',')]);

    // Warn before leaving with unsaved edits.
    useEffect(function () {
      var any = Object.keys(st.drafts).some(function (id) { return isDirty(id); });
      var fn = function (e) { if (any) { e.preventDefault(); e.returnValue = ''; } };
      window.addEventListener('beforeunload', fn);
      return function () { window.removeEventListener('beforeunload', fn); };
    });

    // Autosave for the Pace groups and Settings tabs (no Save buttons in the mockup).
    var timers = useRef({});
    function autosave(key, fn) {
      clearTimeout(timers.current[key]);
      set(function (p) { var s2 = Object.assign({}, p.saveState); s2[key] = 'Unsaved changes…'; return { saveState: s2 }; });
      timers.current[key] = setTimeout(function () {
        set(function (p) { var s2 = Object.assign({}, p.saveState); s2[key] = 'Saving…'; return { saveState: s2 }; });
        fn().then(function () {
          set(function (p) { var s2 = Object.assign({}, p.saveState); s2[key] = 'All changes saved.'; return { saveState: s2 }; });
        }, function (e) {
          set(function (p) { var s2 = Object.assign({}, p.saveState); s2[key] = 'Not saved: ' + e.message; return { saveState: s2 }; });
        });
      }, 800);
    }

    // ------------------------------------------------------------ sessions

    function itemsInWeek(mon) {
      var end = C.addDays(mon, 6);
      return Object.keys(st.items).map(function (id) { return st.items[id]; })
        .filter(function (it) { return it.date >= mon && it.date <= end; })
        .sort(function (a, b) { return (a.date + timeKey(a)).localeCompare(b.date + timeKey(b)); });
    }
    function timeKey(it) { var t = C.parseTime(savedOf(it).time || it.base.time); return t ? C.pad2(t.h) + C.pad2(t.m) : '0000'; }
    function contentOf(id) { return st.drafts[id] || savedOf(st.items[id]); }
    function isDirty(id) { var it = st.items[id]; return !!(it && st.drafts[id] && JSON.stringify(st.drafts[id]) !== JSON.stringify(savedOf(it))); }
    // ph = default, dr = draft / unpublished changes, pb = published
    function vstate(id) {
      var it = st.items[id];
      if (!it) return 'ph';
      if (!it.row) return isDirty(id) ? 'dr' : 'ph';
      return it.row.status === 'Published' && !isDirty(id) ? 'pb' : 'dr';
    }
    var vlabel = { ph: 'Default', dr: 'Draft', pb: '' };

    var item = st.items[st.sel] || null;
    var cur = item ? contentOf(st.sel) : null;
    var ti = cur ? Math.max(0, Math.min(st.ti, cur.tracks.length - 1)) : 0;
    var trk0 = cur ? cur.tracks[ti] : null;

    function mutate(fn) {
      set(function (p) {
        var it = p.items[p.sel];
        if (!it) return {};
        var c = clone(p.drafts[p.sel] || savedOf(it));
        fn(c);
        var d = Object.assign({}, p.drafts); d[p.sel] = c;
        return { drafts: d, toast: '' };
      });
    }
    function setTrack(field, v) { mutate(function (c) { var i = Math.max(0, Math.min(st.ti, c.tracks.length - 1)); c.tracks[i][field] = v; }); }
    function setField(field) { return function (e) { var v = val(e); mutate(function (c) { c[field] = v; }); }; }

    function select(id) { set({ sel: id, ti: 0, toast: '', addWeek: '', importOpen: false, pubAll: null, histOpen: false, hist: null, conflict: '', delAsk: false }); }

    function save(publish) {
      if (!item || st.busy) return;
      var it = item, c = contentOf(st.sel);
      var baseRev = it.row ? it.row.rev : (it.placeholderRev || 0);
      set({ busy: true, toast: '' });
      api('saveSession', { id: it.id, date: it.date, content: c, publish: publish, baseRev: baseRev }).then(function (res) {
        set(function (p) {
          var items = Object.assign({}, p.items); items[res.id] = res;
          var d = Object.assign({}, p.drafts); delete d[res.id];
          var liveFrom = C.addDays(C.mondayOf(res.date), -7 * p.savedSet.weeksFwd);
          var msg = publish
            ? 'Published. ' + (liveFrom <= today ? 'It will show on the athlete page within a minute.' : 'Athletes will see it from ' + C.monLabel(liveFrom) + '.') + (res.row && /^error/.test(res.row.calendarSynced) ? ' The calendar event could not be updated; check it in Google Calendar.' : '')
            : (res.row.status === 'Draft' ? 'Saved as a draft. Athletes do not see it yet.' : 'Saved. Athletes still see the last published version until you publish.');
          return { items: items, drafts: d, busy: false, toast: msg, toastBad: false, hist: null, histOpen: false };
        });
      }, function (e) {
        set({ busy: false, toast: e.message, toastBad: true, conflict: e.code === 'conflict' ? e.message : '' });
      });
    }

    function reloadSelected(discard) {
      if (!item) return;
      var cm = chunkOf(item.date), id = item.id;
      set(function (p) {
        var l = Object.assign({}, p.loaded); delete l[cm];
        var d = Object.assign({}, p.drafts); if (discard) delete d[id];
        return { loaded: l, drafts: d, conflict: '', toast: '' };
      });
    }

    function it2hasContent(it) { return !!(it && it.row); }
    function baseRevOf(it) { return it.row ? it.row.rev : (it.placeholderRev || 0); }

    // First drops unsaved typing; a second click (or a saved draft) asks the
    // server to go back to the published version, or to Default.
    function discard() {
      if (!item) return;
      var id = item.id;
      if (isDirty(id)) {
        if (!window.confirm('Throw away the edits you have not saved?')) return;
        set(function (p) { var d = Object.assign({}, p.drafts); delete d[id]; return { drafts: d, toast: 'Unsaved edits thrown away.', toastBad: false, conflict: '' }; });
        return;
      }
      if (!item.row || item.row.status === 'Published') return;
      var back = item.row.publishedAt ? 'the version athletes see (published ' + item.row.publishedAt + ')' : 'the series defaults (nothing published yet)';
      if (!window.confirm('Discard the saved draft and go back to ' + back + '? You can still restore it from History.')) return;
      set({ busy: true });
      api('discardDraft', { id: id, date: item.date, baseRev: baseRevOf(item) }).then(function (res) {
        set(function (p) {
          var items = Object.assign({}, p.items); items[id] = res.item;
          var d = Object.assign({}, p.drafts); delete d[id];
          return { items: items, drafts: d, busy: false, toast: 'Draft discarded.', toastBad: false, hist: null, histOpen: false, ti: 0 };
        });
      }, function (e) { set({ busy: false, toast: e.message, toastBad: true, conflict: e.code === 'conflict' ? e.message : '' }); });
    }

    function doDelete() {
      if (!item) return;
      var id = item.id;
      set({ busy: true });
      api('deleteSession', { id: id, date: item.date, baseRev: baseRevOf(item), deleteEvent: !!st.delEvent && item.onCalendar }).then(function (res) {
        set(function (p) {
          var items = Object.assign({}, p.items);
          var d = Object.assign({}, p.drafts); delete d[id];
          if (res.removed) delete items[id]; else items[id] = res.item;
          return { items: items, drafts: d, busy: false, delAsk: false, sel: res.removed ? '' : p.sel, ti: 0, hist: null, histOpen: false,
            toast: res.removed ? 'Session deleted.' : 'Workout deleted. The session is back to its defaults and athletes see it as not posted. You can restore it from History.', toastBad: false };
        });
      }, function (e) { set({ busy: false, toast: e.message, toastBad: true, conflict: e.code === 'conflict' ? e.message : '' }); });
    }

    function renderDelete() {
      var it = item, has = it2hasContent(it);
      var kids = [];
      if (!it.onCalendar) kids.push(h('div', { key: 't' }, 'Delete this session? It only exists in this editor, so it disappears for everyone.'));
      else {
        kids.push(h('div', { key: 't' }, has ? 'Delete this workout? Athletes will see the session as not posted. Earlier versions stay in History.' : 'This session has no workout yet. To remove the session itself, delete its Google Calendar event.'));
        kids.push(h('label', { key: 'c', style: { display: 'flex', gap: 6, alignItems: 'center', marginTop: 6 } }, [
          h('input', { key: 'i', type: 'checkbox', checked: !!st.delEvent, onChange: function () { set({ delEvent: !st.delEvent }); } }),
          h('span', { key: 's' }, 'Also delete the Google Calendar event (removes the session for everyone)')
        ]));
      }
      var can = !it.onCalendar || has || st.delEvent;
      kids.push(h('div', { key: 'b', style: { display: 'flex', gap: 8, marginTop: 8 } }, [
        h('button', { key: 'd', className: 'btn danger', disabled: st.busy || !can, onClick: doDelete }, st.delEvent && it.onCalendar ? 'Delete session and calendar event' : 'Delete'),
        h('button', { key: 'c', className: 'btn', onClick: function () { set({ delAsk: false }); } }, 'Cancel')
      ]));
      return h('div', { key: 'delask', className: 'confirm' }, kids);
    }

    function openHistory() {
      if (st.histOpen) { set({ histOpen: false }); return; }
      set({ histOpen: true, hist: null });
      api('history', { id: st.sel }).then(function (list) { set({ hist: list }); }, function (e) { set({ hist: [], toast: e.message, toastBad: true }); });
    }
    function restore(rev) {
      set({ busy: true });
      api('revert', { id: st.sel, rev: rev }).then(function (res) {
        set(function (p) {
          var items = Object.assign({}, p.items); items[res.id] = res;
          var d = Object.assign({}, p.drafts); delete d[res.id];
          return { items: items, drafts: d, busy: false, histOpen: false, hist: null, toast: 'Restored version ' + rev + ' as a draft. Publish to show it to athletes.', toastBad: false };
        });
      }, function (e) { set({ busy: false, toast: e.message, toastBad: true }); });
    }

    // ------------------------------------------------------------ new session pane

    function seriesDow(key) {
      var hits = Object.keys(st.items).map(function (id) { return st.items[id]; }).filter(function (it) { return it.seriesKey === key; });
      return hits.length ? (C.dow(hits[hits.length - 1].date) + 6) % 7 : 0; // days after Monday
    }
    function openAdd(mon) {
      var k = st.add.series;
      var sx = st.series.filter(function (x) { return x.key === k; })[0];
      set({ addWeek: mon, importOpen: false, toast: '', add: Object.assign({}, st.add, { from: C.addDays(mon, sx ? seriesDow(k) : 0), until: '' }, sx ? { time: sx.time, loc: sx.loc, wu: sx.wu } : {}) });
    }
    function onAddSeries(e) {
      var k = val(e);
      var sx = st.series.filter(function (x) { return x.key === k; })[0];
      var from = st.addWeek ? C.addDays(st.addWeek, sx ? seriesDow(k) : 0) : st.add.from;
      set({ add: Object.assign({}, st.add, sx ? { series: k, time: sx.time, loc: sx.loc, wu: sx.wu, from: from } : { series: k, time: '', loc: '', wu: '', from: from }) });
    }
    function setAdd(f) { return function (e) { var v = val(e); set(function (p) { var a = Object.assign({}, p.add); a[f] = v; return { add: a }; }); }; }
    function doAdd() {
      var a = st.add;
      if (!a.from) { set({ toast: 'Pick the first date.', toastBad: true }); return; }
      set({ busy: true });
      api('createSessions', { seriesKey: a.series, title: a.title, loc: a.loc, time: a.time, wu: a.wu, from: a.from, until: a.until, createCalendar: a.cal }).then(function (res) {
        set(function (p) {
          var l = Object.assign({}, p.loaded);
          Object.keys(l).forEach(function (cm) { if (cm <= C.addDays(a.until || a.from, 0) && C.addDays(cm, CHUNK_DAYS - 1) >= a.from) delete l[cm]; });
          return { loaded: l, busy: false, addWeek: '', sel: res.firstId || p.sel, ti: 0, top: C.addDays(C.mondayOf(a.from), -7),
            toast: 'Added ' + res.count + ' ' + res.name + ' session' + (res.count === 1 ? '' : 's') + (res.createdCalendar ? ' and created the calendar events.' : '.') + ' They start as defaults until you edit them.', toastBad: false };
        });
      }, function (e) { set({ busy: false, toast: e.message, toastBad: true }); });
    }

    // ------------------------------------------------------------ import

    function buildPreview(text, year) {
      var rows = I.parseTsv(text);
      if (rows.length < 2) return { error: 'Paste the header row and at least one row of workouts.' };
      var res = I.convertRows(rows, { firstRowYear: parseInt(year, 10) || +today.slice(0, 4), source: 'Row' });
      if (!res.sessions.length && res.warnings.length) return { error: res.warnings[0], columns: res.columns };
      var list = I.expandForSeries(res.sessions, st.series);
      return { columns: res.columns, sessions: list, cells: res.cells, warnings: res.warnings, skippedDays: res.sessions.filter(function (c) { return !c.seriesKeys.length; }).length };
    }
    function doImport() {
      var pv = st.imp.preview;
      if (!pv || !pv.sessions || !pv.sessions.length) return;
      set({ busy: true });
      api('importSessions', { overwriteDrafts: !!st.imp.overwrite, sessions: pv.sessions.map(function (s) { return { date: s.date, seriesKey: s.seriesKey, note: s.note, tracks: s.tracks }; }) }).then(function (res) {
        var msg = 'Created ' + res.created + ' draft' + (res.created === 1 ? '' : 's') + '.' + (res.updated ? ' Replaced ' + res.updated + ' existing draft' + (res.updated === 1 ? '' : 's') + '.' : '') + (res.skipped.length ? ' Skipped ' + res.skipped.length + ': ' + res.skipped.slice(0, 5).map(function (x) { return x.date + ' ' + x.reason; }).join(' ') + (res.skipped.length > 5 ? ' …' : '') : '');
        set(function (p) { return { busy: false, loaded: {}, imp: Object.assign({}, p.imp, { result: msg }), toast: msg, toastBad: false }; });
      }, function (e) { set({ busy: false, toast: e.message, toastBad: true }); });
    }

    // Publish every saved draft. Asks the server for a count first, then
    // publishes in rounds (each round stops before Apps Script's time limit).
    function openPublishAll() {
      set({ pubAll: { phase: 'loading' }, importOpen: false, addWeek: '', toast: '' });
      api('publishAll', { dryRun: true }).then(function (sum) {
        set({ pubAll: { phase: 'ask', sum: sum } });
      }, function (e) { set({ pubAll: { phase: 'error', msg: e.message } }); });
    }
    function runPublishAll() {
      var total = 0, skipped = [], calErr = 0;
      var round = function () {
        return api('publishAll', {}).then(function (res) {
          total += res.published; calErr += res.calendarErrors || 0; skipped = skipped.concat(res.skipped || []);
          if (res.remaining > 0 && res.published > 0) {
            set(function (p) { return { pubAll: Object.assign({}, p.pubAll, { done: total }) }; });
            return round();
          }
          var msg = 'Published ' + total + ' session' + (total === 1 ? '' : 's') + '.' +
            (res.remaining ? ' ' + res.remaining + ' upcoming sessions are still drafts; click Publish all again.' : '') +
            (skipped.length ? ' Skipped ' + skipped.length + ' that are no longer on the calendar.' : '') +
            (calErr ? ' ' + calErr + ' calendar event' + (calErr === 1 ? '' : 's') + ' could not be updated; check them in Google Calendar.' : '');
          set(function (p) {
            // Unsaved edits stay; everything else reloads from the server.
            return { busy: false, loaded: {}, pubAll: { phase: 'done', msg: msg }, toast: msg, toastBad: !!calErr };
          });
        });
      };
      set(function (p) { return { busy: true, pubAll: Object.assign({}, p.pubAll, { phase: 'running', done: 0 }) }; });
      round().catch(function (e) {
        set({ busy: false, loaded: {}, pubAll: { phase: 'error', msg: 'Stopped after ' + total + ': ' + e.message + ' Click Publish all drafts again to continue.' } });
      });
    }

    // ------------------------------------------------------------ chips

    function chipItems(mon, big) {
      var out = itemsInWeek(mon).map(function (it) {
        var v = vstate(it.id), c = contentOf(it.id), rt = raceOf(c);
        return h('button', {
          key: it.id, className: 'cp ' + (big ? 'cs ' : 'cl ') + v + (rt ? ' race' : '') + (it.cancelled ? ' cx' : '') + (it.id === st.sel && !st.addWeek && !st.importOpen && !st.pubAll ? ' on' : ''),
          onClick: function () { select(it.id); }, title: c.series + (it.cancelled ? ' (cancelled on the calendar)' : '')
        }, [
          h('span', { className: 'a', key: 'a' }, shortDay(it.date)),
          h('span', { className: 'b', key: 'b' }, it.cancelled ? 'Cancelled' : rt ? (rt.abbr || C.deriveAbbr(rt.raceName)) : (big ? c.series : it.base.short)),
          h('span', { className: 'c', key: 'c' }, vlabel[v])
        ]);
      });
      out.push(h('button', { key: 'plus', className: 'cp cl plus' + (st.addWeek === mon ? ' on' : ''), onClick: function () { openAdd(mon); }, 'aria-label': 'Add a session to this week', title: 'Add a session to this week' }, '+'));
      return out;
    }

    // ------------------------------------------------------------ render: header

    var header = h('div', { className: 'topbar', key: 'top' }, [
      h('img', { key: 'i', src: window.CNW_LOGO, alt: 'Club Northwest logo' }),
      h('b', { key: 'b', style: { fontSize: 18, letterSpacing: '.04em', textTransform: 'uppercase' } }, 'Workouts editor'),
      h('div', { key: 't', style: { display: 'flex', gap: 4, marginLeft: 12 } }, [
        h('button', { key: 'w', className: 'tabbtn' + (st.tab === 'w' ? ' on' : ''), onClick: function () { set({ tab: 'w' }); } }, 'Workouts'),
        h('button', { key: 'g', className: 'tabbtn' + (st.tab === 'g' ? ' on' : ''), onClick: function () { set({ tab: 'g' }); } }, 'Pace groups'),
        h('button', { key: 's', className: 'tabbtn' + (st.tab === 's' ? ' on' : ''), onClick: function () { set({ tab: 's' }); } }, 'Settings')
      ]),
      h('div', { key: 'who', className: 'who' }, [
        h('span', { key: 'e' }, boot.me.email + (isAdmin ? ' (admin)' : '')),
        window.CNW_MODE === 'local' ? h('a', { key: 'l', href: '/login' }, 'Switch user')
          : WEB ? h('a', { key: 'w', href: '#', onClick: function (e) { e.preventDefault(); if (!Object.keys(st.drafts).some(isDirty) || window.confirm('Switch account? Edits you have not saved will be lost.')) Auth.switchAccount(); } }, 'Switch account')
          : null
      ])
    ]);

    var body;

              };
            };
            return h('div', { key: r.key, style: { marginBottom: 10 } }, [
              h('div', { key: 'a', style: { display: 'flex', alignItems: 'center', gap: 12 } }, [
                h('div', { key: 'n', style: { flex: '0 0 190px', fontSize: 14 } }, r.name),
                h('input', { key: 'i', className: 'inp', value: r.tracks, onChange: setS(i, 'tracks'), disabled: ro, 'aria-label': r.name + ' default tracks' })
              ]),
              h('div', { key: 'g', style: { display: 'flex', gap: 14, flexWrap: 'wrap', margin: '4px 0 0 202px', fontSize: 13, color: '#333' } }, [h('span', { key: 'l', className: 'muted' }, 'Pace groups:')].concat(names.map(function (n) {
                return h('label', { key: n, style: { display: 'flex', alignItems: 'center', gap: 4 } }, [
                  h('input', { key: 'c', type: 'checkbox', checked: !C.groupsOffFor(n, r.noGroups), disabled: ro, onChange: toggle(n), 'aria-label': r.name + ' ' + n + ' pace groups' }),
                  h('span', { key: 's' }, n)
                ]);
              })))
            ]);
          })
        ])
      ];
      if (isAdmin) kids.push(renderCoaches());
      return h('div', { key: 'stab', style: { padding: 24, maxWidth: 1240 } }, kids);
    }

    function renderCoaches() {
      var call = function (name, args) {
        set({ busy: true });
        api(name, args).then(function (res) { set({ busy: false, coaches: res.coaches, coachMsg: res.message, invEmail: name === 'inviteCoach' ? '' : st.invEmail }); },
          function (e) { set({ busy: false, coachMsg: e.message }); });
      };
      return h('div', { key: 'coaches', className: 'card', style: { maxWidth: 1100 } }, [
        h('b', { key: 'b', style: { fontSize: 14, color: '#203c7f', textTransform: 'uppercase' } }, 'Coaches'),
        h('div', { key: 'n', style: { fontSize: 13, color: '#444', margin: '6px 0 10px', lineHeight: 1.5 } }, 'Anyone listed here can sign in with that email and edit workouts. Admins can also invite and remove coaches and change settings.'),
        h('table', { key: 't', className: 'gt' }, [
          h('thead', { key: 'h' }, h('tr', null, [h('th', { key: 1 }, 'Email'), h('th', { key: 2, style: { width: 130 } }, 'Role'), h('th', { key: 3, style: { width: 150 } }, 'Status'), h('th', { key: 4, style: { width: 90 } }, '')])),
          h('tbody', { key: 'b' }, st.coaches.map(function (c) {
            return h('tr', { key: c.email }, [
              h('td', { key: 1 }, c.email),
              h('td', { key: 2 }, h('select', { className: 'inp', value: c.role, disabled: st.busy, onChange: function (e) { call('updateCoach', { email: c.email, role: val(e) }); } }, [h('option', { key: 'a', value: 'Admin' }, 'Admin'), h('option', { key: 'c', value: 'Coach' }, 'Coach')])),
              h('td', { key: 3 }, c.status),
              h('td', { key: 4 }, h('button', { className: 'btn sm', title: 'Remove this coach', 'aria-label': 'Remove this coach', disabled: st.busy, onClick: function () { if (window.confirm('Remove ' + c.email + '? Their next save will be refused. Their past edits stay in History.')) call('removeCoach', { email: c.email }); } }, 'Remove'))
            ]);
          }))
        ]),
        h('div', { key: 'inv', style: { display: 'flex', gap: 8, alignItems: 'center', marginTop: 12, flexWrap: 'wrap' } }, [
          h('input', { key: 'e', className: 'inp', style: { width: 300 }, type: 'email', placeholder: 'coach@gmail.com', value: st.invEmail, onChange: function (e) { set({ invEmail: val(e), coachMsg: '' }); }, 'aria-label': 'Email to invite', maxLength: 200 }),
          h('select', { key: 'r', className: 'inp', style: { width: 110 }, value: st.invRole, onChange: function (e) { set({ invRole: val(e) }); } }, [h('option', { key: 'c', value: 'Coach' }, 'Coach'), h('option', { key: 'a', value: 'Admin' }, 'Admin')]),
          h('button', { key: 'b', className: 'btn pri', disabled: st.busy, onClick: function () { call('inviteCoach', { email: st.invEmail, role: st.invRole }); } }, 'Invite coach')
        ]),
        st.coachMsg ? h('div', { key: 'm', style: { marginTop: 8, fontSize: 13, color: '#1f5a35', fontWeight: 'bold' } }, st.coachMsg) : null
      ]);
    }
  }

  // Sign-in card (web mode). Shown over the page whenever a call is waiting
  // for a Google sign-in: at the start, and if the hour-long sign-in runs out.
  function SignIn() {
    var again = Auth.resumed();
    return h('div', { className: 'signin', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'signin-h' }, h('div', { className: 'signin-card' }, [
      h('img', { key: 'i', src: window.CNW_LOGO, alt: 'Club Northwest logo' }),
      h('h2', { key: 'h', id: 'signin-h' }, again ? 'Please sign in again' : 'CNW workouts editor'),
      h('p', { key: 'p' }, again ? 'Your Google sign-in timed out. Sign in to keep working; nothing you typed is lost.' : 'Sign in with the Google account your invite was sent to.'),
      h('button', { key: 'b', className: 'btn pri gbtn', onClick: Auth.signIn }, 'Sign in with Google'),
      Auth.error() ? h('div', { key: 'e', className: 'warn', style: { marginTop: 12 } }, Auth.error()) : null
    ]));
  }

  function Root() {
    var s = useState(0), bump = s[1];
    useEffect(function () {
      var redraw = function () { bump(function (x) { return x + 1; }); };
      var off = Auth.subscribe(redraw);
      redraw(); // the editor's first calls start before this runs
      return off;
    }, []);
    return h(React.Fragment, null, [h(App, { key: 'a' }), WEB && Auth.waiting() ? h(SignIn, { key: 's' }) : null]);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(Root));
})();

</script>
</body>
</html>
